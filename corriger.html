.tbl-actions{display:flex;gap:6px;flex-wrap:wrap}

.tbl-actions button:hover{border-color:var(--blue);color:var(--blue)}

.modal-body{padding:24px}

/* ---------- CHARGEMENT DB ---------- */
const STORAGE_KEY='caeer_db_v1';
let DB = loadDB();
let LANG='fr', ROUTE={name:'home',param:null};

function deepMerge(base,override){
  if(Array.isArray(override)) return override;
  if(typeof override!=='object'||override===null) return override!==undefined?override:base;
  const out=Array.isArray(base)?[]:{...base};
  for(const k of Object.keys(override)) out[k]=deepMerge(base&&base[k],override[k]);
  return out;
}
function loadDB(){
  if(window.__INJECTED_DB__){
    try{ return deepMerge(JSON.parse(JSON.stringify(DEFAULT_DB)),window.__INJECTED_DB__); }catch(e){}
  }
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DB));
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_DB)),JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DB)); }
}
function saveDB(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DB)); }catch(e){ alert('Erreur de sauvegarde : '+e.message); } }
function resetDB(){ if(confirm(t('admin.reset')+' ?')){ DB=JSON.parse(JSON.stringify(DEFAULT_DB)); saveDB(); render(); } }

const $=(s,c=document)=>c.querySelector(s);
const $$=(s,c=document)=>Array.from(c.querySelectorAll(s));
function t(k,l=LANG){const d=I18N[l]||I18N.fr;return d[k]!==undefined?d[k]:(I18N.fr[k]!==undefined?I18N.fr[k]:k);}

/* ✅ FONCTION L() CORRIGÉE — gère les deux structures */
function L(o,f){
  if(!o) return '';
  // Cas 1 : structure {fr:{name,desc,...}, en:{...}}
  if(o[LANG] && o[LANG][f] !== undefined) return o[LANG][f];
  if(o.fr && o.fr[f] !== undefined) return o.fr[f];
  // Cas 2 : structure {history:{fr,en}, mission:{fr,en}} — section "À propos"
  if(f && o[f] && typeof o[f] === 'object'){
    if(o[f][LANG] !== undefined) return o[f][LANG];
    if(o[f].fr !== undefined) return o[f].fr;
  }
  return '';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(iso){const d=new Date(iso);if(isNaN(d))return iso;return d.toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});}
function waLink(msg){return 'https://wa.me/'+DB.identity.whatsapp+'?text='+encodeURIComponent(msg||t('contact.wa.msg'));}
function slugify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function uid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function serviceName(slug){const s=DB.services.find(x=>x.slug===slug);return s?L(s,'name'):slug;}

    const clean=(path||'').replace(/^\/+/,'');
    canon.href='https://www.caeerbtp.cm/'+LANG+'/'+clean;
    $$('link[rel="alternate"]').forEach(l=>{const hl=l.getAttribute('hreflang');if(hl==='fr')l.href='https://www.caeerbtp.cm/fr/'+clean;if(hl==='en')l.href='https://www.caeerbtp.cm/en/'+clean;if(hl==='x-default')l.href='https://www.caeerbtp.cm/fr/'+clean;});
    document.documentElement.lang=LANG;
  }
};

/* ---------- COMPOSANTS ---------- */
function ph(label,cls=''){return `<div class="ph ${cls}"><span>${esc(label)}</span></div>`;}
function visual(item,label,cls=''){
  if(item.img)return `<img src="${esc(item.img)}" alt="${esc(label)}" loading="lazy" style="aspect-ratio:16/10;object-fit:cover;width:100%">`;
  return ph(label,cls);
}
function secHead(eyebrow,title,lead,center=false){return `<div class="sec-head ${center?'center':''} reveal"><span class="eyebrow">${esc(eyebrow)}</span><h2>${esc(title)}</h2>${lead?`<p>${esc(lead)}</p>`:''}</div>`;}

/* ✅ pageHead CORRIGÉE — nettoie les entités doublement échappées */
function pageHead(title,lead){
  const clean = (s) => String(s||'').replace(/&amp;#39;/g,"'").replace(/&amp;#x27;/g,"'");
  return `<section class="pagehead"><div class="wrap"><h1>${esc(title)}</h1>${lead?`<p>${esc(clean(lead))}</p>`:''}</div></section>`;
}
function breadcrumb(items){return `<nav class="crumb wrap">`+items.map((it,i)=>it.href?`<a href="${it.href}">${esc(it.label)}</a>${i<items.length-1?'<span>/</span>':''}`:`<span style="opacity:1;color:var(--ink)">${esc(it.label)}</span>`).join('')+`</nav>`;}
function quickBar(){return `<div class="quickbar"><div class="wrap"><strong>${t('quick.title')}</strong><div class="qb-links"><a class="qb" href="tel:${DB.identity.phone}">📞 ${t('quick.call')} — ${DB.identity.phoneDisplay}</a><a class="qb" href="${waLink()}" target="_blank" rel="noopener">💬 ${t('quick.wa')}</a><a class="qb" href="${ROUTER.href('devis')}">📝 ${t('quick.quote')}</a></div></div></div>`;}
function projectCard(p){
  const status=p.status==='delivered'?'delivered':'ongoing';
  return `<article class="card reveal"><a href="${ROUTER.href('realisations',p.slug)}">${visual(p,L(p,'title'))}</a>

  <a class="more" href="${ROUTER.href('realisations',p.slug)}">${t('common.readmore')} →</a></div></article>`;

function articleCard(a,kind){

  <div class="card-body"><div class="meta"><span class="badge badge-cat">${esc(a.cat||t('news.title'))}</span><span>📅 ${fmtDate(a.date)}</span></div>

  listEntity(type,title){
    const items=DB[type]||[];
    const cols=this.getCols(type);
    return `<div class="admin-bar"><h2>${title}</h2><button class="btn btn-primary btn-sm" onclick="ADMIN.editItem('${type}',-1)">${t('admin.add')}</button></div>
    <div class="panel">${items.length?`<div style="overflow-x:auto"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${items.map((it,i)=>`<tr>${this.renderRow(type,it).map(v=>`<td>${v}</td>`).join('')}<td class="tbl-actions">
        <button onclick="ADMIN.editItem('${type}',${i})">✏️</button>
        ${i>0?`<button class="move" onclick="ADMIN.moveItem('${type}',${i},-1)">↑</button>`:''}
        ${i<items.length-1?`<button class="move" onclick="ADMIN.moveItem('${type}',${i},1)">↓</button>`:''}
        <button class="del" onclick="ADMIN.delItem('${type}',${i})">🗑</button>
      </td></tr>`).join('')}
    </tbody></table></div>`:`<p style="color:var(--muted)">Aucun élément.</p>`}</div>`;
  },
  getCols(type){
    switch(type){
      case 'services':return ['Icône','Nom FR','Nom EN','Slug','Image'];
      case 'projects':return ['Titre FR','Métier','Année','Lieu','Statut','Image'];
      case 'news':return ['Date','Titre FR','Image'];
      case 'articles':return ['Date','Titre FR','Catégorie','Image'];
      case 'testimonials':return ['Auteur FR','Texte FR'];
      case 'stats':return ['Valeur','Label FR','Label EN'];
    }
    return [];
  },
  renderRow(type,it){
    switch(type){
      case 'services':return [it.icon||'',`<b>${esc(it.fr.name)}</b>`,esc(it.en.name),`<code>${esc(it.slug)}</code>`,it.img?'✅':'—'];
      case 'projects':return [`<b>${esc(it.fr.title)}</b>`,esc(serviceName(it.cat)),it.year||'',esc(it.place),t('common.'+it.status),it.img?'✅':'—'];
      case 'news':return [it.date,`<b>${esc(it.fr.title)}</b>`,it.img?'✅':'—'];
      case 'articles':return [it.date,`<b>${esc(it.fr.title)}</b>`,esc(it.cat||''),it.img?'✅':'—'];
      case 'testimonials':return [`<b>${esc(it.fr.author)}</b>`,esc(it.fr.text).slice(0,80)+'…'];
      case 'stats':return [`<b>${it.value}${it.suffix||''}</b>`,esc(it.fr),esc(it.en)];
    }
    return [];
  },
  editItem(type,idx){
    const def=this.getDefault(type);
    const item=idx>=0?JSON.parse(JSON.stringify(DB[type][idx])):def;
    const formHTML=this.getForm(type,item);
    const title=(idx>=0?t('admin.edit'):t('admin.add'))+' — '+type;
    this.openModal(title,formHTML,()=>{
      const data=this.collectForm(type);
      if(idx>=0)DB[type][idx]=data;else DB[type].unshift(data);
      saveDB();render();
    });
  },

  exportJSON(){
    const data=JSON.stringify({db:DB,quotes:JSON.parse(localStorage.getItem('caeer_quotes')||'[]'),messages:JSON.parse(localStorage.getItem('caeer_messages')||'[]'),version:'1.0',exported:new Date().toISOString()},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caeer-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  },
  importJSON(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(j.db)DB=j.db;if(j.quotes)localStorage.setItem('caeer_quotes',JSON.stringify(j.quotes));if(j.messages)localStorage.setItem('caeer_messages',JSON.stringify(j.messages));saveDB();alert('✅ Import réussi.');render();}catch(err){alert('Fichier invalide : '+err.message);}};
    r.readAsText(f);
  },
  resetAll(){resetDB();},
  downloadSite(){
    fetch(location.href,{cache:'no-store'}).then(r=>r.text()).then(src=>{
      const injection='<script>window.__INJECTED_DB__='+JSON.stringify(DB).replace(/</g,'\\u003c')+';<\/script>';
      let modified=src.replace(/(<body[^>]*>)/, '$1'+injection);
      const blob=new Blob([modified],{type:'text/html;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();
      alert('✅ Fichier index.html téléchargé avec toutes vos données !\n\nUploadez-le sur votre hébergeur (dossier public_html) pour publier le site.');
    }).catch(err=>{
      alert('Impossible de récupérer le HTML source ('+err.message+').\n\nUn fichier JSON de sauvegarde va être téléchargé à la place. Utilisez-le avec l\'option Importer.');
      ADMIN.exportJSON();
    });

  moveItem(type,i,dir){const arr=DB[type];const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];saveDB();render();},
  delItem(type,i){if(!confirm(t('admin.confirm')))return;DB[type].splice(i,1);saveDB();render();},
  imageUploader(current,id){
    return `<div class="img-uploader"><input type="file" accept="image/*" onchange="ADMIN.handleImage(event,'${id}')">
      <div style="font-size:.85rem">${current?'Cliquez pour changer':'📷 Choisir une image'}</div>
      <input type="hidden" id="${id}" value="${esc(current||'')}">
      ${current?`<img src="${esc(current)}" alt="">`:''}
    </div>`;
  },
  handleImage(e,id){
    const f=e.target.files[0];if(!f)return;
    if(f.size>3*1024*1024){if(!confirm('Image > 3 Mo. Continuer ?'))return;}
    const r=new FileReader();
    r.onload=()=>{$('#'+id).value=r.result;const box=e.target.closest('.img-uploader');const old=box.querySelector('img');if(old)old.remove();const img=document.createElement('img');img.src=r.result;box.appendChild(img);};
    r.readAsDataURL(f);
  },
  editor(html,id){
    return `<div class="wysiwyg"><div class="toolbar">
      <button type="button" data-cmd="bold"><b>B</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>

      <button type="button" data-cmd="formatBlock" data-arg="p">¶</button>
      <button type="button" data-cmd="insertUnorderedList">•</button>
      <button type="button" data-cmd="createLink">🔗</button>
      <button type="button" data-cmd="removeFormat">✕</button>
    </div><div class="editor" contenteditable="true" id="${id}">${html||''}</div></div>`;
  },
  openModal(title,formHTML,onSave){
    const overlay=$('#modalOverlay'),modal=$('#modalContent');
    modal.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button type="button" onclick="ADMIN.closeModal()">×</button></div>
      <div class="modal-body">${formHTML}</div>
      <div class="modal-foot"><button class="btn btn-outline" type="button" onclick="ADMIN.closeModal()">${t('admin.cancel')}</button><button class="btn btn-primary" type="button" id="modalSave">${t('admin.save')}</button></div>`;
    overlay.classList.add('open');
    setTimeout(()=>{
      $$('.wysiwyg .toolbar button').forEach(b=>b.onclick=e=>{e.preventDefault();const cmd=b.dataset.cmd,arg=b.dataset.arg;if(cmd==='createLink'){const u=prompt('URL :');if(u)document.execCommand(cmd,false,u);}else document.execCommand(cmd,false,arg||null);});
    },50);
    $('#modalSave').onclick=()=>{try{onSave();this.closeModal();}catch(err){alert('Erreur : '+err.message);}};
  },
  closeModal(){$('#modalOverlay').classList.remove('open');}
};

  let html='',seo={};
  switch(ROUTE.name){

    case 'entreprise':html=viewAbout();seo={title:t('about.title'),description:t('about.lead'),path:'entreprise'};break;
    case 'services':{const s=ROUTE.param?DB.services.find(x=>x.slug===ROUTE.param):null;html=viewServices(ROUTE.param);seo=s?{title:L(s,'name'),description:L(s,'short'),path:'services/'+ROUTE.param}:{title:t('services.title'),description:t('services.lead'),path:'services'};break;}

    case 'references':html=viewRefs();seo={title:t('refs.title'),description:t('refs.lead'),path:'references'};break;
    case 'actualites':{const n=ROUTE.param?DB.news.find(x=>x.slug===ROUTE.param):null;html=viewNews(ROUTE.param);seo=n?{title:L(n,'title'),description:L(n,'excerpt'),path:'actualites/'+ROUTE.param}:{title:t('news.title'),description:t('news.lead'),path:'actualites'};break;}
    case 'articles':{const a=ROUTE.param?DB.articles.find(x=>x.slug===ROUTE.param):null;html=viewArticles(ROUTE.param);seo=a?{title:L(a,'title'),description:L(a,'meta'),path:'articles/'+ROUTE.param}:{title:t('blog.title'),description:t('blog.lead'),path:'articles'};break;}
    case 'devis':html=viewQuote();seo={title:t('quote.title'),description:t('quote.lead'),path:'devis'};break;
    case 'contact':html=viewContact();seo={title:t('contact.title'),description:t('contact.lead'),path:'contact'};break;
    case 'mentions-legales':case 'confidentialite':case 'cookies':html=viewLegalPage(ROUTE.name);seo={title:t(ROUTE.name==='mentions-legales'?'legal.title':ROUTE.name==='confidentialite'?'privacy.title':'cookiespage.title'),description:'',path:ROUTE.name};break;
    case 'admin':html=ADMIN.render();seo={title:t('admin.title'),description:'',path:'admin'};break;
    default:html=viewNotFound();seo={title:t('common.notfound'),description:'',path:ROUTE.name};
  }
  main.innerHTML=html;
  SEO.update(seo);
  syncNav();
  bindCommon();

  if(ROUTE.name==='devis')bindQuoteForm();
  if(ROUTE.name==='contact')bindContactForm();
  if(ROUTE.name==='realisations')bindProjectFilters();
  if(ROUTE.name==='articles')bindArticleFilters();
  if(ROUTE.name==='admin')bindAdmin();

  /* ✅ Formulaire "Textes" — redirige id.* vers DB.identity */
  const tf=$('#textsForm');
  if(tf)tf.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(tf);
    fd.forEach((v,k)=>{
      if(k.startsWith('hero.cards.')){
        const m=k.match(/^hero\.cards\.(\w+)\.(\d)$/);
        if(m){const [,lang,idx]=m;if(!DB.hero.cards[lang])DB.hero.cards[lang]=[];DB.hero.cards[lang][+idx]=v;return;}
      }
      if(k.startsWith('hero.')){ setPath(DB,k,v); return; }
      DB.identity[k]=v;
    });
    saveDB();alert(t('admin.saved'));render();
  });
  const af=$('#aboutForm');
  if(af)af.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(af);
    fd.forEach((v,k)=>{
      if(k.startsWith('values.')){
        const m=k.match(/^values\.(\w+)\.(\d)\.(\d)$/);
        if(m){const [,lang,idx,sub]=m;if(!DB.about.values[lang][+idx])DB.about.values[lang][+idx]=['',''];DB.about.values[lang][+idx][+sub]=v;return;}
      }
      if(k==='qse.fr'||k==='qse.en'){const lang=k.split('.')[1];DB.about.qse[lang]=v.split('\n').map(x=>x.trim()).filter(Boolean);return;}
      setPath(DB.about,k,v);
    });
    saveDB();alert(t('admin.saved'));render();
  });
  const lf=$('#legalForm');
  if(lf)lf.addEventListener('submit',e=>{
    e.preventDefault();
    DB.pages.mentions.fr=$('#f_mentfr').innerHTML;DB.pages.mentions.en=$('#f_menten').innerHTML;
    DB.pages.privacy.fr=$('#f_privfr').innerHTML;DB.pages.privacy.en=$('#f_priven').innerHTML;
    DB.pages.cookies.fr=$('#f_cookfr').innerHTML;DB.pages.cookies.en=$('#f_cooken').innerHTML;
    saveDB();alert(t('admin.saved'));render();
  });
  window.scrollTo({top:0,behavior:'auto'});
}
function setPath(obj,path,value){
  const parts=path.split('.');
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){
    const k=isNaN(parts[i])?parts[i]:Number(parts[i]);
    if(!(k in cur))cur[k]={};
    cur=cur[k];
  }
  const last=isNaN(parts[parts.length-1])?parts[parts.length-1]:Number(parts[parts.length-1]);
  cur[last]=value;
}

const NAV_ITEMS=[{route:'home',key:'nav.home'},{route:'entreprise',key:'nav.about'},{route:'services',key:'nav.services'},{route:'realisations',key:'nav.projects'},{route:'references',key:'nav.refs'},{route:'actualites',key:'nav.news'},{route:'articles',key:'nav.blog'},{route:'contact',key:'nav.contact'}];

function initCounters(){
  const els=$$('[data-count]');if(!els.length)return;
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
      const target=Number(el.dataset.count),suffix=el.dataset.suffix||'';const dur=1400,start=performance.now();
      const step=now=>{const p=Math.min((now-start)/dur,1);const eased=1-Math.pow(1-p,3);el.innerHTML=Math.round(target*eased)+(suffix?`<span class="suf">${suffix}</span>`:'');if(p<1)requestAnimationFrame(step);};
      requestAnimationFrame(step);
    });
  },{threshold:.3});
  els.forEach(el=>io.observe(el));
}

/* ✅ initReveal CORRIGÉE — filet de sécurité à 1,5 s */
function initReveal(){
  const els = $$('.reveal');
  if(!els.length) return;
  const forceAll = () => els.forEach(e => e.classList.add('in'));
  if(!('IntersectionObserver' in window)){ forceAll(); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.01, rootMargin: '0px' });
  els.forEach(el => io.observe(el));
  setTimeout(forceAll, 1500);
}

const FORM={
  v:{required:x=>String(x||'').trim().length>0,email:x=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(x||'').trim()),phone:x=>String(x||'').replace(/[\s\-().]/g,'').length>=8},
  mark(input,ok){const f=input.closest('.field');if(f)f.classList.toggle('invalid',!ok);input.setAttribute('aria-invalid',String(!ok));return ok;}
};
function bindQuoteForm(){
  const form=$('#quoteForm');if(!form)return;
  const fileInput=$('#q_files'),fileList=$('#fileList'),dropZone=$('#dropZone');
  let files=[];
  const renderFiles=()=>{fileList.innerHTML=files.map((f,i)=>`<li><span>📎 ${esc(f.name)} <small style="color:var(--muted)">(${(f.size/1024/1024).toFixed(2)} Mo)</small></span><button type="button" data-rm="${i}">✕</button></li>`).join('');$$('[data-rm]',fileList).forEach(b=>b.onclick=()=>{files.splice(Number(b.dataset.rm),1);renderFiles();});};
  const addFiles=incoming=>{Array.from(incoming).forEach(f=>{if(files.length>=3)return;if(!/\.(pdf|jpe?g|png)$/i.test(f.name))return;if(f.size>5*1024*1024)return;files.push(f);});renderFiles();};
  fileInput.addEventListener('change',e=>addFiles(e.target.files));
  ['dragenter','dragover'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.classList.remove('drag');}));
  dropZone.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  form.addEventListener('submit',async e=>{
    e.preventDefault();const f=form.elements;let ok=true;
    ok=FORM.mark(f.name,FORM.v.required(f.name.value))&&ok;
    ok=FORM.mark(f.phone,FORM.v.phone(f.phone.value))&&ok;
    ok=FORM.mark(f.email,FORM.v.email(f.email.value))&&ok;
    ok=FORM.mark(f.place,FORM.v.required(f.place.value))&&ok;
    ok=FORM.mark(f.desc,FORM.v.required(f.desc.value))&&ok;
    if(f.website&&f.website.value)ok=false;
    const expected=Number(f.captchaExpected.value),got=Number(f.captcha.value);
    if(expected!==got){f.captcha.closest('.field').classList.add('invalid');ok=false;}
    if(!ok){const fi=form.querySelector('.field.invalid');if(fi)fi.scrollIntoView({behavior:'smooth',block:'center'});return;}
    const btn=$('#quoteSubmit');btn.disabled=true;btn.textContent=t('quote.sending');
    const q=JSON.parse(localStorage.getItem('caeer_quotes')||'[]');
    q.push({id:uid(),date:new Date().toISOString(),name:f.name.value.trim(),company:f.company.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),type:f.type.value,place:f.place.value.trim(),budget:f.budget.value.trim(),desc:f.desc.value.trim(),files:files.map(x=>x.name)});
    localStorage.setItem('caeer_quotes',JSON.stringify(q));
    await new Promise(r=>setTimeout(r,600));
    $('#quoteAlert').innerHTML=`<div class="alert alert-ok"><b>✅ ${t('quote.ok')}</b><br><br><button class="btn btn-outline btn-sm" onclick="location.reload()">${t('quote.again')}</button></div>`;
    form.reset();files=[];renderFiles();btn.disabled=false;btn.textContent=t('quote.submit');window.scrollTo({top:0,behavior:'smooth'});
  });
}
function bindContactForm(){
  const form=$('#contactForm');if(!form)return;
  form.addEventListener('submit',e=>{
    e.preventDefault();const f=form.elements;let ok=true;
    ok=FORM.mark(f.name,FORM.v.required(f.name.value))&&ok;
    ok=FORM.mark(f.email,FORM.v.email(f.email.value))&&ok;
    ok=FORM.mark(f.subject,FORM.v.required(f.subject.value))&&ok;
    ok=FORM.mark(f.msg,FORM.v.required(f.msg.value))&&ok;
    if(f.website&&f.website.value)ok=false;
    if(!ok)return;
    const m=JSON.parse(localStorage.getItem('caeer_messages')||'[]');
    m.push({id:uid(),date:new Date().toISOString(),name:f.name.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),subject:f.subject.value.trim(),msg:f.msg.value.trim()});
    localStorage.setItem('caeer_messages',JSON.stringify(m));
    $('#contactAlert').innerHTML=`<div class="alert alert-ok"><b>✅ ${t('contact.ok')}</b></div>`;form.reset();
  });
}

const CHAT={
  open:false,contactMode:false,
  kb:[
    {q:['service','prestation','travaux','faites-vous'],a:()=>`Nos services :<br>${DB.services.map(s=>`• <a href="${ROUTER.href('services',s.slug)}">${esc(L(s,'name'))}</a>`).join('<br>')}`},
    {q:['devis','prix','coût','combien'],a:()=>`Pour un devis, remplissez notre <a href="${ROUTER.href('devis')}">formulaire</a>. Réponse sous 48h.`},
    {q:['zone','où','intervenez','région','cameroun'],a:()=>`Nous intervenons partout au Cameroun, avec une présence à Douala et Yaoundé.`},
    {q:['contact','téléphone','mail','email','joindre','adresse'],a:()=>`📞 <a href="tel:${DB.identity.phone}">${DB.identity.phoneDisplay}</a><br>✉️ <a href="mailto:${DB.identity.email}">${DB.identity.email}</a><br>💬 <a href="${waLink()}" target="_blank">WhatsApp</a><br>📍 ${esc(DB.identity.address)}`},
    {q:['humain','conseiller','quelqu','parler','appel'],a:()=>`Contactez-nous :<br>📞 <a href="tel:${DB.identity.phone}">${DB.identity.phoneDisplay}</a><br>💬 <a href="${waLink()}" target="_blank">WhatsApp</a>`},
    {q:['bonjour','salut','hello','bonsoir'],a:()=>`Bonjour 👋 Comment puis-je vous aider ?`},
    {q:['rendez-vous','rdv','visite'],a:()=>`Appelez-nous au <a href="tel:${DB.identity.phone}">${DB.identity.phoneDisplay}</a> ou <a href="${waLink()}" target="_blank">WhatsApp</a>.`},
    {q:['référence','projet','réalisation'],a:()=>`Découvrez nos <a href="${ROUTER.href('realisations')}">réalisations</a>.`}
  ],
  match(input){
    const s=input.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const pm=s.match(/(\+?\d[\d\s().-]{7,})/);
    if(this.contactMode&&pm){
      const name=input.replace(pm[0],'').replace(/[,;]/g,'').trim()||'Visiteur';
      const l=JSON.parse(localStorage.getItem('caeer_leads')||'[]');l.push({id:uid(),date:new Date().toISOString(),name,phone:pm[0].trim()});localStorage.setItem('caeer_leads',JSON.stringify(l));
      this.contactMode=false;return 'Merci ! Vos coordonnées ont été transmises à notre équipe.';
    }
    for(const item of this.kb){if(item.q.some(k=>s.includes(k)))return item.a();}
    this.contactMode=true;
    return `${t('chat.fallback')}<br>📞 <a href="tel:${DB.identity.phone}">${DB.identity.phoneDisplay}</a><br>💬 <a href="${waLink()}" target="_blank">WhatsApp</a><br>✉️ <a href="mailto:${DB.identity.email}">${DB.identity.email}</a><br><br>${t('chat.contact.capture')}`;
  },
  addMsg(text,who='bot'){const log=$('#chatLog');const d=document.createElement('div');d.className='msg '+who;d.innerHTML=text;log.appendChild(d);log.scrollTop=log.scrollHeight;},
  init(){
    $('#chatLog').innerHTML='';this.addMsg(t('chat.hello'));
    const quick=['Quels services ?','Obtenir un devis','Où intervenez-vous ?','Vos coordonnées ?','Parler à un humain'];
    $('#chatQuick').innerHTML=quick.map(q=>`<button>${q}</button>`).join('');
    $$('#chatQuick button').forEach(b=>b.onclick=()=>{this.addMsg(esc(b.textContent),'user');setTimeout(()=>this.addMsg(this.match(b.textContent)),400);});
  }
};
function openChat(){CHAT.open=true;$('#chatPanel').classList.add('open');$('#chatFab').setAttribute('aria-expanded','true');if(!$('#chatLog').children.length)CHAT.init();}
function closeChat(){CHAT.open=false;$('#chatPanel').classList.remove('open');$('#chatFab').setAttribute('aria-expanded','false');}

function initApp(){
  render();
  $('#year').textContent=new Date().getFullYear();
  $('#chatFab').onclick=()=>CHAT.open?closeChat():openChat();
  $('#chatClose').onclick=closeChat;
  $('#chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatInput'),v=i.value.trim();if(!v)return;CHAT.addMsg(esc(v),'user');i.value='';setTimeout(()=>CHAT.addMsg(CHAT.match(v)),450);});
  $('#lbClose').onclick=()=>$('#lightbox').classList.remove('open');
  $('#lightbox').onclick=e=>{if(e.target.id==='lightbox')$('#lightbox').classList.remove('open');};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lightbox').classList.remove('open');closeChat();$('#modalOverlay').classList.remove('open');}});
  if(localStorage.getItem('caeer_cookies')===null)setTimeout(()=>$('#cookieBar').classList.add('show'),1200);
  $('#ckAccept').onclick=()=>{localStorage.setItem('caeer_cookies','accepted');$('#cookieBar').classList.remove('show');};
  $('#ckRefuse').onclick=()=>{localStorage.setItem('caeer_cookies','refused');$('#cookieBar').classList.remove('show');};
  window.addEventListener('hashchange',render);
  $('#modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')ADMIN.closeModal();});
}
document.addEventListener('DOMContentLoaded',initApp);
